<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFlow - Reserva de Espaços</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

    <!-- Accessibility Live Region for Screen Readers -->
    <div id="aria-live-region" aria-live="polite" class="sr-only"></div>

    <!-- Global Toast/Alert Container -->
    <div id="toast-container" class="toast-container" aria-live="assertive"></div>

    <!-- Main App Container (SPA Root) -->
    <div id="app" class="app-container">
        <!-- Content will be injected here by app.js -->
    </div>

    <!-- Main JS -->
    <script src="app.js"></script>
</body>
</html>
